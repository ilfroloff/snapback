[package]
name = "snapback"
# Baseline release version. From here on the version is bumped automatically by
# release-plz from Conventional Commits (feat -> minor, fix/perf -> patch; see
# release-plz.toml), and each release is cut as a `v{version}` git tag + GitHub
# Release, installed straight from that tagged git ref (see README.md). The first
# release tags v0.1.0.
version = "0.7.0"
edition = "2021"
description = "Browse, search, and resume Claude Code sessions from a ratatui TUI."

# DO NOT add a `publish` key here - not even `publish = false`. It silently
# disables releasing: cargo-metadata then reports this package's `publish` as
# `[]`, release-plz's `release` command drops non-publishable packages before it
# ever reaches the git-only path that creates BOTH the tag and the GitHub
# Release, and the run still goes GREEN having cut nothing. The no-publish guard
# lives in release-plz.toml (`git_only = true` + `publish = false`), where it
# stops release-plz from ever running `cargo publish` without hiding this package
# from the release path.

# Personal, standalone tool. The module tree lives in the library crate
# (src/lib.rs) so it compiles once, and two thin binary shims (src/main.rs ->
# snapback, src/bin/sb.rs -> sb) are autodiscovered by Cargo. `cargo install
# --path .` installs both binaries. See ./README.md.

# Exact version pins for reproducibility. `nucleo` is pinned per the plan's Risks
# table (evolving API, isolated behind src/search.rs); the rest are pinned exact
# to keep the toolchain deterministic for this personal binary.
[dependencies]
# Terminal rendering. Default features include the crossterm backend, plus
# `unstable-rendered-line-info` for `Paragraph::line_count`: the transcript's
# content height MUST be measured with the same word wrapper that paints it, and
# `ratatui_widgets::reflow` (where `WordWrapper` lives) is a private module, so
# that one accessor is the only public door to it. The API is upstream-unstable
# ("the design for text wrapping is not stable"), which is exactly why the
# version stays pinned EXACT — the wrapper cannot change under us without a
# deliberate bump.
ratatui = { version = "=0.30.2", features = ["unstable-rendered-line-info"] }
# Terminal control + input events (matches the crossterm backend used by ratatui 0.30).
crossterm = "=0.29.0"
# Multiline text editor widget for the quick-reply compose zone. DEFAULT features
# only (its `crossterm` feature, so `From<crossterm::KeyEvent> for Input` is
# available and it renders on the same backend); the optional `search` feature —
# which would pull `regex` — is intentionally NOT enabled (no regex in the tree).
# Exact-pin because it is pre-1.0 (0.9.2 caret-unifies with the modular
# ratatui-core 0.1.x stack). All `ratatui_textarea` references stay confined to
# src/tui/compose.rs (+ the `App::compose` field), the way nucleo lives in search.
ratatui-textarea = "=0.9.2"
# Substring matcher (AtomKind::Substring in code, never fuzzy). Backs the
# HIGHLIGHT seam only -- the per-keystroke filter is memchr below. Pinned exact;
# all nucleo calls isolated in src/search.rs.
nucleo = "=0.5.0"
# SIMD byte-substring search (memmem). IS the per-keystroke filter: it answers
# membership per atom over the prebuilt haystacks, with nucleo not involved
# (src/search.rs). Already in the tree transitively via nucleo (nucleo-matcher)
# and serde_json; pinned exact.
memchr = "=2.8.2"
# Filesystem watcher for autorefresh over ~/.claude/projects.
notify = "=8.2.0"
# ~200ms debounce that coalesces notify event storms into one "sessions changed".
notify-debouncer-mini = "=0.7.0"
# Fail-soft JSONL parsing as serde_json::Value (never hard-typed structs).
serde_json = "=1.0.150"
# RFC 3339 timestamp parsing/formatting for session sort + display.
time = { version = "=0.3.53", features = ["parsing", "formatting", "macros"] }
# Resolve the home directory for the default ~/.claude/projects store root.
dirs = "=6.0.0"
# Ergonomic error propagation across the data core and TUI.
anyhow = "=1.0.103"
# Parallel per-file scan in SessionStore::load (Task 2.7). Already in the tree via nucleo.
rayon = "=1.12.0"
# Extended grapheme-cluster boundaries for the search-match highlight, which
# splits a rendered line into styled spans. `Line::width` sums unicode-width PER
# SPAN and that width is a CONTEXTUAL fold, so a boundary inside a cluster (an
# emoji cut from its VS16 or its skin-tone modifier) changes the summed width of
# text that did not change, desyncing the preview's cached widths and cached
# wrapped-row count from the line on screen. Snapping run boundaries out to
# cluster edges is the fix, and a grapheme table is never hand-rolled. Already in
# the tree transitively via ratatui-textarea / nucleo-matcher / unicode-truncate;
# pinned exact.
unicode-segmentation = "=1.13.3"
# Terminal display-width of stripped table-cell text so inline markers (**x**,
# [a](b)) and CJK/emoji measure at their rendered column count, keeping table
# columns aligned. Already in the tree transitively via ratatui; pinned exact.
unicode-width = "=0.2.2"
